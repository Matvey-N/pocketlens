name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend — build, unit + integration tests, coverage gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build and verify (unit tests, Testcontainers integration tests, JaCoCo ≥ 80 %)
        working-directory: backend
        run: mvn -B -ntp verify
      - name: Coverage summary
        if: always()
        working-directory: backend
        run: |
          if [ -f target/site/jacoco/jacoco.csv ]; then
            awk -F, 'NR>1 {missed+=$8; covered+=$9} END {printf "Business-logic line coverage: %.1f%%\n", 100*covered/(missed+covered)}' \
              target/site/jacoco/jacoco.csv | tee -a "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload test and coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-reports
          path: |
            backend/target/site/jacoco
            backend/target/surefire-reports
            backend/target/failsafe-reports
          retention-days: 14

  frontend:
    name: Frontend — lint, type-check, unit tests, build, e2e
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Security audit (fail on critical vulnerabilities)
        run: npm audit --omit=dev --audit-level=critical
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:coverage
      - run: npm run build
      - name: End-to-end tests (Playwright)
        run: |
          npx playwright install --with-deps chromium
          npm run e2e
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-reports
          path: |
            frontend/coverage
            frontend/playwright-report
          retention-days: 14

  api-docs:
    name: API docs — lint OpenAPI contract and build Redoc site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Lint OpenAPI with Redocly
        run: npx --yes @redocly/cli@latest lint docs/reference/openapi.yaml --config docs/redocly.yaml
      - name: Build static reference
        run: npx --yes @redocly/cli@latest build-docs docs/reference/openapi.yaml --output docs-site/index.html
      - uses: actions/upload-artifact@v4
        with:
          name: api-reference
          path: docs-site

  images:
    name: Docker images → GitHub Container Registry
    needs: [backend, frontend, api-docs]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image names
        id: names
        run: echo "owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"
      - name: Backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ steps.names.outputs.owner }}/pocketlens-backend:latest
            ghcr.io/${{ steps.names.outputs.owner }}/pocketlens-backend:${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend
      - name: Frontend image
        uses: docker/build-push-action@v6
        with:
          context: frontend
          push: true
          tags: |
            ghcr.io/${{ steps.names.outputs.owner }}/pocketlens-frontend:latest
            ghcr.io/${{ steps.names.outputs.owner }}/pocketlens-frontend:${{ github.sha }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend
      - name: Scan backend image for critical vulnerabilities (Trivy)
        env:
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: |
          docker run --rm -e TRIVY_USERNAME -e TRIVY_PASSWORD aquasec/trivy:latest image \
            --severity CRITICAL --ignore-unfixed --exit-code 1 --no-progress \
            ghcr.io/${{ steps.names.outputs.owner }}/pocketlens-backend:${{ github.sha }}

  deploy:
    name: Deploy to production
    needs: images
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Deploy the latest main to the server over SSH
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_KEY: ${{ secrets.SSH_KEY }}
        run: |
          if [ -z "$SSH_HOST" ] || [ -z "$SSH_KEY" ]; then
            echo "SSH_HOST / SSH_KEY secrets are not configured; skipping deployment." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/id_deploy && chmod 600 ~/.ssh/id_deploy
          ssh -i ~/.ssh/id_deploy -o StrictHostKeyChecking=accept-new "${SSH_USER:-ubuntu}@$SSH_HOST" \
            'cd ~/pocketlens && git pull --ff-only && docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build && docker image prune -f'
          echo "Deployed ${{ github.sha }} to $SSH_HOST" >> "$GITHUB_STEP_SUMMARY"
