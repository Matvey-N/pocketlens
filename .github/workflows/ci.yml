name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend — build, unit + integration tests, coverage gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build and verify (unit tests, Testcontainers integration tests, JaCoCo ≥ 80 %)
        working-directory: backend
        run: mvn -B -ntp verify
      - name: Coverage summary
        if: always()
        working-directory: backend
        run: |
          if [ -f target/site/jacoco/jacoco.csv ]; then
            awk -F, 'NR>1 {missed+=$8; covered+=$9} END {printf "Business-logic line coverage: %.1f%%\n", 100*covered/(missed+covered)}' \
              target/site/jacoco/jacoco.csv | tee -a "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload test and coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-reports
          path: |
            backend/target/site/jacoco
            backend/target/surefire-reports
            backend/target/failsafe-reports
          retention-days: 14

