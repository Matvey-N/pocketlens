components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 'Access token from login, registration or refresh. Valid for 15 minutes. Send as `Authorization: Bearer
        <token>`.'
    refreshCookie:
      type: apiKey
      in: cookie
      name: pl_refresh
      description: Opaque refresh token (7 days) set by the server as an `HttpOnly; SameSite=Strict` cookie limited to 
        `/api/v1/auth`. Browsers send it automatically; it cannot be read by JavaScript.

  headers:
    RefreshCookie:
      description: '`pl_refresh=<token>; Path=/api/v1/auth; Max-Age=604800; HttpOnly; SameSite=Strict` (plus `Secure` in production).'
      schema:
        type: string

  parameters:
    Id:
      name: id
      in: path
      required: true
      description: Resource id (UUID).
      schema:
        type: string
        format: uuid
    Page:
      name: page
      in: query
      description: Zero-based page index.
      schema:
        type: integer
        minimum: 0
        default: 0
    Size:
      name: size
      in: query
      description: Page size.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    Month:
      name: month
      in: query
      description: Calendar month as `YYYY-MM`. Default is the current month.
      schema:
        type: string
        pattern: '^\d{4}-\d{2}$'
        example: 2026-11

  responses:
    ValidationFailed:
      description: The request is invalid (`VALIDATION_FAILED`, `MALFORMED_REQUEST` or `IMPORT_FILE_INVALID`). Field 
        errors are listed in `errors`.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://pocketlens.app/problems/validation-failed
            title: Request validation failed
            status: 400
            detail: One or more fields are invalid
            code: VALIDATION_FAILED
            errors:
              - field: email
                message: must be a well-formed email address
              - field: password
                message: size must be between 10 and 72
            correlationId: 3e4f5a6b-7c8d-4e9f-a0b1-c2d3e4f5a6b7
            timestamp: '2026-11-22T10:15:30Z'
    Unauthorized:
      description: The access token is missing, invalid or expired (`UNAUTHORIZED`). Refresh the session and retry.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://pocketlens.app/problems/unauthorized
            title: Authentication required
            status: 401
            detail: A valid access token is required. Log in or refresh the session.
            code: UNAUTHORIZED
            correlationId: 5a6b7c8d-9e0f-4a1b-8c2d-3e4f5a6b7c8d
            timestamp: '2026-11-22T10:15:30Z'
    Forbidden:
      description: The user does not have the required role (`FORBIDDEN`).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://pocketlens.app/problems/forbidden
            title: Access denied
            status: 403
            detail: You do not have permission for this action
            code: FORBIDDEN
            correlationId: 6b7c8d9e-0f1a-4b2c-9d3e-4f5a6b7c8d9e
            timestamp: '2026-11-22T10:15:30Z'
    NotFound:
      description: The resource does not exist or belongs to another user (`NOT_FOUND`).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://pocketlens.app/problems/not-found
            title: Resource not found
            status: 404
            detail: Transaction 9f8e7d6c-5b4a-4398-8172-6f5e4d3c2b1a was not found
            code: NOT_FOUND
            correlationId: 7c8d9e0f-1a2b-4c3d-8e4f-5a6b7c8d9e0f
            timestamp: '2026-11-22T10:15:30Z'
    Conflict:
      description: The request conflicts with existing data, e.g. a duplicate name or e-mail (`CONFLICT`).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://pocketlens.app/problems/conflict
            title: Resource already exists
            status: 409
            detail: A category named 'Pets' already exists
            code: CONFLICT
            correlationId: 8d9e0f1a-2b3c-4d4e-9f5a-6b7c8d9e0f1a
            timestamp: '2026-11-22T10:15:30Z'
    FileTooLarge:
      description: The file exceeds 5 MB (`FILE_TOO_LARGE`).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://pocketlens.app/problems/file-too-large
            title: File is too large
            status: 413
            detail: The file exceeds the maximum size of 5 MB
            code: FILE_TOO_LARGE
            correlationId: 9e0f1a2b-3c4d-4e5f-8a6b-7c8d9e0f1a2b
            timestamp: '2026-11-22T10:15:30Z'
    RateLimited:
      description: More than 20 assistant questions per minute (`RATE_LIMITED`). Wait the number of seconds in 
        `Retry-After`.
      headers:
        Retry-After:
          description: Seconds to wait before the next request.
          schema:
            type: integer
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://pocketlens.app/problems/rate-limited
            title: Too many requests
            status: 429
            detail: Request limit reached. Try again in 23 s
            code: RATE_LIMITED
            retryAfterSeconds: 23
            correlationId: 0f1a2b3c-4d5e-4f6a-9b7c-8d9e0f1a2b3c
            timestamp: '2026-11-22T10:15:30Z'
    AiUnavailable:
      description: The AI provider is not configured, timed out or returned an error after one retry (`AI_UNAVAILABLE`).
        The question is kept; retry later.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://pocketlens.app/problems/ai-unavailable
            title: The AI service is temporarily unavailable
            status: 503
            detail: The assistant is temporarily unavailable. Please try again later.
            code: AI_UNAVAILABLE
            correlationId: 1a2b3c4d-5e6f-4a7b-8c8d-9e0f1a2b3c4d
            timestamp: '2026-11-22T10:15:30Z'

  schemas:
    Problem:
      type: object
      description: RFC 9457 problem details with PocketLens extension members.
      required: [type, title, status, code]
      properties:
        type:
          type: string
          format: uri
          description: URI of the error type.
        title:
          type: string
          description: Short, human-readable summary of the error type.
        status:
          type: integer
          description: HTTP status code.
        detail:
          type: string
          description: Explanation of this occurrence, safe to show to the user.
        instance:
          type: string
          description: Request path.
        code:
          $ref: '#/components/schemas/ErrorCode'
        correlationId:
          type: string
          description: Id of the request in the logs (also in the `X-Correlation-Id` response header). Quote it when 
            reporting a problem.
        timestamp:
          type: string
          format: date-time
        errors:
          type: array
          description: Field errors (only for `VALIDATION_FAILED`).
          items:
            type: object
            properties:
              field:
                type: string
              message:
                type: string
        missingColumns:
          type: array
          description: Only for `IMPORT_COLUMNS_MISSING`.
          items:
            type: string
        foundColumns:
          type: array
          description: Only for `IMPORT_COLUMNS_MISSING`.
          items:
            type: string
        rowErrors:
          type: array
          description: Only for `IMPORT_ROWS_INVALID` (at most 20 entries).
          items:
            type: object
            properties:
              row:
                type: integer
              message:
                type: string
        retryAfterSeconds:
          type: integer
          description: Only for `RATE_LIMITED`.
    ErrorCode:
      type: string
      description: Stable machine-readable error code. See the error taxonomy in docs/concepts/errors.md.
      enum:
        - VALIDATION_FAILED
        - MALFORMED_REQUEST
        - IMPORT_FILE_INVALID
        - IMPORT_COLUMNS_MISSING
        - IMPORT_ROWS_INVALID
        - PROMPT_REJECTED
        - UNAUTHORIZED
        - INVALID_CREDENTIALS
        - INVALID_REFRESH_TOKEN
        - FORBIDDEN
        - NOT_FOUND
        - METHOD_NOT_ALLOWED
        - CONFLICT
        - FILE_TOO_LARGE
        - UNSUPPORTED_MEDIA_TYPE
        - RATE_LIMITED
        - INTERNAL_ERROR
        - AI_UNAVAILABLE

    PrivacyNotice:
      type: object
      required: [version, text]
      properties:
        version:
          type: string
          example: '2026-11'
        text:
          type: string

    RegisterRequest:
      type: object
      required: [email, password, displayName, acceptPrivacyNotice, privacyNoticeVersion]
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          minLength: 10
          maxLength: 72
          description: 10–72 characters with at least one letter and one digit.
          format: password
        displayName:
          type: string
          maxLength: 80
        acceptPrivacyNotice:
          type: boolean
          description: Must be `true`.
        privacyNoticeVersion:
          type: string
          description: Version from `GET /api/v1/privacy-notice`.

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          maxLength: 254
        password:
          type: string
          maxLength: 72
          format: password

    AuthResponse:
      type: object
      required: [accessToken, tokenType, expiresIn, user]
      properties:
        accessToken:
          type: string
          description: JWT (HS256) with claims `sub` (user id), `roles`, `iss`, `iat`, `exp`.
        tokenType:
          type: string
          enum: [Bearer]
        expiresIn:
          type: integer
          description: Lifetime of the access token in seconds.
        user:
          $ref: '#/components/schemas/User'

    User:
      type: object
      required: [id, email, displayName, role]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        displayName:
          type: string
        role:
          type: string
          enum: [USER, ADMIN]
        privacyNoticeVersion:
          type: string
        createdAt:
          type: string
          format: date-time

    DeleteAccountRequest:
      type: object
      required: [password]
      properties:
        password:
          type: string
          maxLength: 72
          format: password

    DataExport:
      type: object
      description: Portable copy of all personal data.
      properties:
        exportedAt:
          type: string
          format: date-time
        profile:
          type: object
          additionalProperties: true
        categories:
          type: array
          items:
            type: object
            additionalProperties: true
        rules:
          type: array
          items:
            type: object
            additionalProperties: true
        budgets:
          type: array
          items:
            type: object
            additionalProperties: true
        transactions:
          type: array
          items:
            type: object
            additionalProperties: true
        conversations:
          type: array
          items:
            type: object
            additionalProperties: true

    StatementFormat:
      type: object
      required: [id, name, delimiter, requiredColumns]
      properties:
        id:
          type: string
        name:
          type: string
        delimiter:
          type: string
        requiredColumns:
          type: array
          items:
            type: string

    ImportSummary:
      type: object
      required: [batchId, rowsRead, imported, duplicates, skipped, needsReview, aiAvailable]
      properties:
        batchId:
          type: string
          format: uuid
        fileName:
          type: string
        format:
          type: string
          description: Display name of the format or mapping used.
        rowsRead:
          type: integer
          description: Data rows in the file.
        imported:
          type: integer
          description: New transactions stored.
        duplicates:
          type: integer
          description: Rows skipped because they were imported before.
        skipped:
          type: integer
          description: Rows that are not booked transactions (e.g. declined) or have a zero amount.
        categorizedByRules:
          type: integer
        categorizedByAi:
          type: integer
        needsReview:
          type: integer
          description: Transactions the user should check (AI confidence below 0.8 or AI unavailable).
        uncategorized:
          type: integer
        aiAvailable:
          type: boolean
          description: '`false` if AI categorisation was needed but unavailable; those transactions are retried automatically
            every 30 minutes.'

    ImportBatch:
      type: object
      properties:
        id:
          type: string
          format: uuid
        fileName:
          type: string
        format:
          type: string
        rowsRead:
          type: integer
        imported:
          type: integer
        duplicates:
          type: integer
        skipped:
          type: integer
        needsReview:
          type: integer
        createdAt:
          type: string
          format: date-time

    CsvPreview:
      type: object
      properties:
        delimiter:
          type: string
        headers:
          type: array
          items:
            type: string
        rows:
          type: array
          items:
            type: array
            items:
              type: string
        matchingFormats:
          type: array
          items:
            type: string

    ImportProfileRequest:
      type: object
      required: [name, delimiter, dateColumn, dateFormat, descriptionColumn, decimalSeparator]
      properties:
        name:
          type: string
          maxLength: 60
        delimiter:
          type: string
          enum: [',', ';', '|', "\t"]
        dateColumn:
          type: string
          maxLength: 80
        dateFormat:
          type: string
          maxLength: 40
          description: java.time pattern, e.g. `yyyy-MM-dd`, `dd.MM.yyyy`, `dd/MM/yyyy HH:mm`.
        descriptionColumn:
          type: string
          maxLength: 80
        amountColumn:
          type: string
          maxLength: 80
          nullable: true
        debitColumn:
          type: string
          maxLength: 80
          nullable: true
        creditColumn:
          type: string
          maxLength: 80
          nullable: true
        currencyColumn:
          type: string
          maxLength: 80
          nullable: true
        defaultCurrency:
          type: string
          pattern: '^[A-Z]{3}$'
          nullable: true
        decimalSeparator:
          type: string
          enum: ['.', ',']

    ImportProfile:
      allOf:
        - $ref: '#/components/schemas/ImportProfileRequest'
        - type: object
          properties:
            id:
              type: string
              format: uuid
            createdAt:
              type: string
              format: date-time

    CategoryRef:
      type: object
      nullable: true
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        color:
          type: string

    Transaction:
      type: object
      required: [id, date, amount, currency, description, merchant, categorizationSource, needsReview]
      properties:
        id:
          type: string
          format: uuid
        date:
          type: string
          format: date
          description: Booking date.
        amount:
          type: number
          description: Negative for expenses, positive for income. Two decimals.
        currency:
          type: string
          description: ISO 4217 code as provided by the bank (no conversion).
        description:
          type: string
          description: Raw description from the statement.
        merchant:
          type: string
          description: Normalised merchant key used by rules.
        category:
          $ref: '#/components/schemas/CategoryRef'
        categorizationSource:
          type: string
          enum: [NONE, RULE, AI, MANUAL]
        confidence:
          type: number
          nullable: true
          minimum: 0
          maximum: 1
          description: Confidence of the AI suggestion (1.00 for rules, null for manual).
        needsReview:
          type: boolean

    TransactionPage:
      type: object
      required: [items, page, size, totalItems, totalPages]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Transaction'
        page:
          type: integer
        size:
          type: integer
        totalItems:
          type: integer
          format: int64
        totalPages:
          type: integer

    UpdateTransactionRequest:
      type: object
      required: [categoryId]
      properties:
        categoryId:
          type: string
          format: uuid
        applyToMerchant:
          type: boolean
          default: false
          description: '"Always use this category for this merchant".'

    UpdateTransactionResponse:
      type: object
      properties:
        transaction:
          $ref: '#/components/schemas/Transaction'
        ruleCreated:
          type: boolean
        recategorizedCount:
          type: integer
          description: Other transactions of the merchant that received the category.

    Category:
      type: object
      required: [id, name, color, kind, isDefault]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        color:
          type: string
          example: '#4CAF50'
        kind:
          type: string
          enum: [EXPENSE, INCOME, TRANSFER]
          description: Only EXPENSE categories count as spending and can have budgets.
        isDefault:
          type: boolean
        systemKey:
          type: string
          nullable: true
          description: Stable key of default categories, e.g. `groceries`.

    CategoryRequest:
      type: object
      required: [name, color, kind]
      properties:
        name:
          type: string
          maxLength: 40
        color:
          type: string
          pattern: '^#[0-9A-Fa-f]{6}$'
        kind:
          type: string
          enum: [EXPENSE, INCOME, TRANSFER]

    Rule:
      type: object
      properties:
        id:
          type: string
          format: uuid
        pattern:
          type: string
          description: Normalised merchant key; matches merchants that contain it at the start of a word.
        categoryId:
          type: string
          format: uuid
        categoryName:
          type: string
        global:
          type: boolean
        createdAt:
          type: string
          format: date-time

    GlobalRuleRequest:
      type: object
      required: [pattern, categoryId]
      properties:
        pattern:
          type: string
          minLength: 2
          maxLength: 120
        categoryId:
          type: string
          format: uuid
          description: A default category.

    BudgetRequest:
      type: object
      required: [categoryId, monthlyLimit, currency]
      properties:
        categoryId:
          type: string
          format: uuid
        monthlyLimit:
          type: number
          minimum: 1
          maximum: 1000000
        currency:
          type: string
          pattern: '^[A-Za-z]{3}$'

    BudgetLimitRequest:
      type: object
      required: [monthlyLimit]
      properties:
        monthlyLimit:
          type: number
          minimum: 1
          maximum: 1000000

    Budget:
      type: object
      properties:
        id:
          type: string
          format: uuid
        categoryId:
          type: string
          format: uuid
        categoryName:
          type: string
        monthlyLimit:
          type: number
        currency:
          type: string

    BudgetStatus:
      type: object
      properties:
        budgetId:
          type: string
          format: uuid
        categoryId:
          type: string
          format: uuid
        categoryName:
          type: string
        categoryColor:
          type: string
        currency:
          type: string
        limit:
          type: number
        spent:
          type: number
        remaining:
          type: number
          description: Negative when exceeded.
        projectedSpending:
          type: number
          description: Linear projection to the end of the month (equals `spent` for past months).
        percentUsed:
          type: integer
        health:
          type: string
          enum: [ON_TRACK, AT_RISK, EXCEEDED]
        projectedOverrunDate:
          type: string
          format: date
          nullable: true
          description: First day on which the limit is expected to be exceeded (only `AT_RISK`).

    Dashboard:
      type: object
      properties:
        month:
          type: string
          example: 2026-11
        currencies:
          type: array
          items:
            $ref: '#/components/schemas/CurrencySummary'
        budgets:
          type: array
          items:
            $ref: '#/components/schemas/BudgetStatus'
        needsReviewCount:
          type: integer
          format: int64

    CurrencySummary:
      type: object
      properties:
        currency:
          type: string
        expenses:
          type: number
        income:
          type: number
        net:
          type: number
        byCategory:
          type: array
          items:
            type: object
            properties:
              categoryId:
                type: string
                format: uuid
                nullable: true
                description: null = uncategorised.
              name:
                type: string
              color:
                type: string
              amount:
                type: number
              count:
                type: integer
                format: int64
        trend:
          type: array
          description: Six months ending with the requested month.
          items:
            type: object
            properties:
              month:
                type: string
              expenses:
                type: number
              income:
                type: number

    Subscription:
      type: object
      properties:
        merchant:
          type: string
        currency:
          type: string
        cadence:
          type: string
          enum: [WEEKLY, MONTHLY, YEARLY]
        lastAmount:
          type: number
        previousAmount:
          type: number
        priceIncreased:
          type: boolean
        monthlyCost:
          type: number
        lastPaymentDate:
          type: string
          format: date
        nextExpectedDate:
          type: string
          format: date
        occurrences:
          type: integer
        transactionIds:
          type: array
          items:
            type: string
            format: uuid

    Conversation:
      type: object
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    ConversationDetail:
      allOf:
        - $ref: '#/components/schemas/Conversation'
        - type: object
          properties:
            messages:
              type: array
              items:
                $ref: '#/components/schemas/Message'

    ToolCall:
      type: object
      properties:
        tool:
          type: string
          enum: [get_spending_total, get_spending_by_category, list_transactions, get_monthly_totals, get_budget_status, 
                get_subscriptions]
        arguments:
          type: object
          additionalProperties: true
        interpretation:
          type: string
          nullable: true
        failed:
          type: boolean
          description: The model passed invalid arguments; it was told the error and could retry.

    Message:
      type: object
      properties:
        id:
          type: string
          format: uuid
        role:
          type: string
          enum: [USER, ASSISTANT]
        content:
          type: string
        interpretation:
          type: array
          description: How the question was understood, one line per tool call (assistant messages only).
          items:
            type: string
        toolCalls:
          type: array
          items:
            $ref: '#/components/schemas/ToolCall'
        sourceTransactionCount:
          type: integer
          description: Number of transactions behind the answer ("Show list").
        createdAt:
          type: string
          format: date-time

    AskRequest:
      type: object
      required: [content]
      properties:
        content:
          type: string
          minLength: 1
          maxLength: 1000
          description: The question in any language.

    Exchange:
      type: object
      properties:
        question:
          $ref: '#/components/schemas/Message'
        answer:
          $ref: '#/components/schemas/Message'

    AnswerSources:
      type: object
      properties:
        transactions:
          type: array
          items:
            $ref: '#/components/schemas/Transaction'
        totals:
          type: array
          items:
            type: object
            properties:
              currency:
                type: string
              amount:
                type: number
                description: Sum of absolute amounts.
              count:
                type: integer
                format: int64

    AdminStats:
      type: object
      properties:
        users:
          type: integer
          format: int64
        transactions:
          type: integer
          format: int64
        assistantAnswersLast30Days:
          type: integer
          format: int64
        aiCallsLast30Days:
          type: integer
          format: int64
        inputTokensLast30Days:
          type: integer
          format: int64
        outputTokensLast30Days:
          type: integer
          format: int64
        aiEnabled:
          type: boolean
