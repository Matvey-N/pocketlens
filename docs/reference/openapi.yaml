openapi: 3.0.3
info:
  title: PocketLens API
  version: 1.0.0
  description: |
    REST API of **PocketLens**, a web application that imports bank statements (CSV), categorises transactions
    automatically (merchant rules first, AI for unknown merchants), tracks monthly budgets with early warnings,
    detects subscriptions and answers spending questions with an AI assistant based on tool calling.

    * **Base path:** `/api/v1` (URI versioning, see the versioning guide).
    * **Format:** JSON (`application/json`) for requests and responses; CSV upload uses `multipart/form-data`.
    * **Authentication:** short-lived JWT access token in the `Authorization: Bearer` header; the refresh token
      is an `HttpOnly` cookie (`pl_refresh`).
    * **Errors:** [RFC 9457](https://www.rfc-editor.org/rfc/rfc9457) problem details with a stable `code`
      (`application/problem+json`).
    * **Data isolation:** every resource belongs to the authenticated user. Resources of other users answer
      `404 Not Found`, so their existence is never revealed.

    Guides: [Getting started](../guides/getting-started.md) ·
    [Tutorial: import and ask the assistant](../guides/tutorial-import-and-ask.md) ·
    [Authentication](../concepts/authentication.md) · [Errors](../concepts/errors.md)
  contact:
    name: PocketLens author
    url: https://github.com/Matvey-N/pocketlens
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
servers:
  - url: http://localhost:8080
    description: Local development (docker compose or `mvn spring-boot:run`)
security:
  - bearerAuth: []
tags:
  - name: Auth
    description: Registration, login, session refresh and privacy notice (US-6.1, US-6.2).
  - name: Account
    description: Current user, data export and account deletion (US-6.3, US-6.4).
  - name: Imports
    description: CSV statement import with built-in bank formats and saved column mappings (UC-1, US-1.1–US-1.4).
  - name: Transactions
    description: Listing, filtering and correcting transactions (US-2.3, US-3.4).
  - name: Categories
    description: Default and custom categories (US-2.4).
  - name: Rules
    description: Merchant rules learned from corrections (US-2.3).
  - name: Budgets
    description: Monthly budgets with projection and early warnings (US-3.1, US-3.2).
  - name: Insights
    description: Dashboard and detected subscriptions (US-3.4, US-5.1, US-5.2).
  - name: Assistant
    description: AI assistant conversations with interpretation and source transactions (UC-2, US-4.1–US-4.4).
  - name: Admin
    description: Default categories, global rules and usage statistics. Requires the `ADMIN` role (US-7.1, US-7.2).

paths:
  /api/v1/privacy-notice:
    get:
      tags: [Auth]
      operationId: getPrivacyNotice
      summary: Get the current privacy notice
      description: Returns the privacy notice that must be accepted at registration. The `version` must be sent back in 
        the registration request.
      security: []
      responses:
        '200':
          description: Current privacy notice.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrivacyNotice'
              example:
                version: '2026-11'
                text: PocketLens stores the transactions you import ... You can export all your data or delete your 
                  account at any time in Settings.

  /api/v1/auth/register:
    post:
      tags: [Auth]
      operationId: register
      summary: Register a new account
      description: Creates a user, records the consent to the privacy notice and starts a session. Sets the 
        refresh-token cookie.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
            example:
              email: anna@example.com
              password: Spring2026secure
              displayName: Anna
              acceptPrivacyNotice: true
              privacyNoticeVersion: '2026-11'
      responses:
        '201':
          description: Account created, user logged in.
          headers:
            Set-Cookie:
              $ref: '#/components/headers/RefreshCookie'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
              example:
                accessToken: 
                  eyJhbGciOiJIUzI1NiJ9.eyJpc3MiOiJwb2NrZXRsZW5zIiwic3ViIjoiYjNmNGU1ZDYiLCJyb2xlcyI6WyJVU0VSIl19.sig
                tokenType: Bearer
                expiresIn: 900
                user:
                  id: b3f4e5d6-a7b8-4c9d-8e0f-1a2b3c4d5e6f
                  email: anna@example.com
                  displayName: Anna
                  role: USER
                  privacyNoticeVersion: '2026-11'
                  createdAt: '2026-11-20T08:00:00Z'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/v1/auth/login:
    post:
      tags: [Auth]
      operationId: login
      summary: Log in
      description: Checks the credentials and starts a session. The response does not reveal whether the e-mail exists.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            example:
              email: anna@example.com
              password: Spring2026secure
      responses:
        '200':
          description: Logged in.
          headers:
            Set-Cookie:
              $ref: '#/components/headers/RefreshCookie'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
              example:
                accessToken: 
                  eyJhbGciOiJIUzI1NiJ9.eyJpc3MiOiJwb2NrZXRsZW5zIiwic3ViIjoiYjNmNGU1ZDYiLCJyb2xlcyI6WyJVU0VSIl19.sig
                tokenType: Bearer
                expiresIn: 900
                user:
                  id: b3f4e5d6-a7b8-4c9d-8e0f-1a2b3c4d5e6f
                  email: anna@example.com
                  displayName: Anna
                  role: USER
                  privacyNoticeVersion: '2026-11'
                  createdAt: '2026-11-20T08:00:00Z'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          description: Wrong e-mail or password.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                type: https://pocketlens.app/problems/invalid-credentials
                title: Invalid e-mail or password
                status: 401
                detail: E-mail or password is incorrect
                code: INVALID_CREDENTIALS
                correlationId: 6f1c2a9e-3b7d-4c55-9a51-0c2d8e4f7a10
                timestamp: '2026-11-22T10:15:30Z'

  /api/v1/auth/refresh:
    post:
      tags: [Auth]
      operationId: refreshSession
      summary: Refresh the session
      description: |
        Exchanges the refresh-token cookie for a new access token **and a new refresh token** (rotation).
        Re-using an already rotated refresh token revokes all sessions of the user.
      security:
        - refreshCookie: []
      responses:
        '200':
          description: New access token; the cookie is replaced.
          headers:
            Set-Cookie:
              $ref: '#/components/headers/RefreshCookie'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
              example:
                accessToken: 
                  eyJhbGciOiJIUzI1NiJ9.eyJpc3MiOiJwb2NrZXRsZW5zIiwic3ViIjoiYjNmNGU1ZDYiLCJyb2xlcyI6WyJVU0VSIl19.sig
                tokenType: Bearer
                expiresIn: 900
                user:
                  id: b3f4e5d6-a7b8-4c9d-8e0f-1a2b3c4d5e6f
                  email: anna@example.com
                  displayName: Anna
                  role: USER
                  privacyNoticeVersion: '2026-11'
                  createdAt: '2026-11-20T08:00:00Z'
        '401':
          description: Missing, expired, revoked or re-used refresh token.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                type: https://pocketlens.app/problems/invalid-refresh-token
                title: Session expired
                status: 401
                detail: The session has expired. Please log in again.
                code: INVALID_REFRESH_TOKEN
                correlationId: 0b6c7f3a-5d1e-4a8b-9f22-7e4d3c2b1a00
                timestamp: '2026-11-22T10:15:30Z'

  /api/v1/auth/logout:
    post:
      tags: [Auth]
      operationId: logout
      summary: Log out
      description: Revokes the refresh token from the cookie (if any) and clears the cookie. Always succeeds.
      security:
        - refreshCookie: []
      responses:
        '204':
          description: Logged out; the cookie is cleared.

  /api/v1/users/me:
    get:
      tags: [Account]
      operationId: getCurrentUser
      summary: Get the current user
      responses:
        '200':
          description: The authenticated user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
              example:
                id: b3f4e5d6-a7b8-4c9d-8e0f-1a2b3c4d5e6f
                email: anna@example.com
                displayName: Anna
                role: USER
                privacyNoticeVersion: '2026-11'
                createdAt: '2026-11-20T08:00:00Z'
        '401':
          $ref: '#/components/responses/Unauthorized'
    delete:
      tags: [Account]
      operationId: deleteAccount
      summary: Delete the account and all data
      description: Deletes the user and, through database cascades, every transaction, rule, budget and conversation 
        (GDPR Art. 17). The current password must be confirmed. This cannot be undone.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeleteAccountRequest'
            example:
              password: Spring2026secure
      responses:
        '204':
          description: Account and all data deleted.
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          description: Not authenticated, or the password is wrong (`INVALID_CREDENTIALS`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

  /api/v1/users/me/export:
    get:
      tags: [Account]
      operationId: exportData
      summary: Export all personal data
      description: Returns all data of the user as a JSON file download (GDPR Art. 15 and 20).
      responses:
        '200':
          description: Data export.
          headers:
            Content-Disposition:
              description: '`attachment; filename="pocketlens-export-YYYY-MM-DD.json"`'
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataExport'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/imports/formats:
    get:
      tags: [Imports]
      operationId: listImportFormats
      summary: List built-in statement formats
      responses:
        '200':
          description: Built-in formats.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/StatementFormat'
              example:
                - id: generic
                  name: PocketLens template (Date, Description, Amount, Currency)
                  delimiter: ','
                  requiredColumns: [Date, Description, Amount, Currency]
                - id: revolut
                  name: Revolut (account statement CSV)
                  delimiter: ','
                  requiredColumns: [Completed Date, Description, Amount, Fee, Currency, State]
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/imports:
    get:
      tags: [Imports]
      operationId: listImports
      summary: List recent imports
      description: The 20 most recent imports of the user with their summaries.
      responses:
        '200':
          description: Import history, newest first.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ImportBatch'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [Imports]
      operationId: importStatement
      summary: Import a CSV statement
      description: |
        Validates the file (CSV, ≤ 5 MB), parses and normalises the rows, skips rows imported before
        (de-duplication), stores new transactions and categorises them (rules → AI → "Needs review").
        Specify **exactly one** of `format` (built-in format id) or `profileId` (saved column mapping).
        A file with missing columns or invalid rows is rejected as a whole — nothing is imported half-way.
      parameters:
        - name: format
          in: query
          description: Id of a built-in format (see `GET /api/v1/imports/formats`).
          schema:
            type: string
            example: generic
        - name: profileId
          in: query
          description: Id of a saved column mapping.
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: CSV file (UTF-8 or Windows-1252), at most 5 MB and 20 000 rows.
      responses:
        '201':
          description: Import finished.
          headers:
            Location:
              description: URL of the import batch.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportSummary'
              example:
                batchId: 3f0e8a52-7c1d-4b9e-a2f4-8d6b5c4e3a21
                fileName: revolut-2026-11.csv
                format: Revolut (account statement CSV)
                rowsRead: 142
                imported: 118
                duplicates: 21
                skipped: 3
                categorizedByRules: 96
                categorizedByAi: 22
                needsReview: 7
                uncategorized: 0
                aiAvailable: true
        '400':
          description: Invalid request — unreadable or empty file (`IMPORT_FILE_INVALID`), neither or both of 
            `format`/`profileId`, unknown format (`VALIDATION_FAILED`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                type: https://pocketlens.app/problems/validation-failed
                title: Request validation failed
                status: 400
                detail: Specify exactly one of 'format' or 'profileId'
                code: VALIDATION_FAILED
                correlationId: 1d2e3f4a-5b6c-4d7e-8f90-a1b2c3d4e5f6
                timestamp: '2026-11-22T10:15:30Z'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '413':
          $ref: '#/components/responses/FileTooLarge'
        '422':
          description: The file does not match the format (`IMPORT_COLUMNS_MISSING`) or contains invalid rows 
            (`IMPORT_ROWS_INVALID`). Nothing was imported.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                missingColumns:
                  summary: Columns missing
                  value:
                    type: https://pocketlens.app/problems/import-columns-missing
                    title: The file does not match the selected format
                    status: 422
                    detail: "Missing columns for format 'PocketLens template (Date, Description, Amount, Currency)': Amount,
                      Currency"
                    code: IMPORT_COLUMNS_MISSING
                    missingColumns: [Amount, Currency]
                    foundColumns: [Date, Description, Sum]
                    correlationId: 9a8b7c6d-5e4f-4a3b-2c1d-0e9f8a7b6c5d
                    timestamp: '2026-11-22T10:15:30Z'
                invalidRows:
                  summary: Invalid rows
                  value:
                    type: https://pocketlens.app/problems/import-rows-invalid
                    title: Some rows of the file contain invalid values
                    status: 422
                    detail: Nothing was imported because some rows are invalid
                    code: IMPORT_ROWS_INVALID
                    rowErrors:
                      - row: 4
                        message: date '2026-13-01' does not match yyyy-MM-dd
                      - row: 9
                        message: amount 'abc' is not a number
                    correlationId: 2b3c4d5e-6f70-4812-93a4-b5c6d7e8f901
                    timestamp: '2026-11-22T10:15:30Z'

  /api/v1/imports/preview:
    post:
      tags: [Imports]
      operationId: previewStatement
      summary: Preview a CSV file
      description: Detects the delimiter and returns the headers, the first five rows and the built-in formats that 
        match. Used by the column-mapping screen (US-1.4). Nothing is stored.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '200':
          description: Preview of the file.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CsvPreview'
              example:
                delimiter: ';'
                headers: [Date, Details, Debit, Credit, Currency]
                rows:
                  - ['03.11.2026', MAXIMA LT-0042, '12,40', '', EUR]
                matchingFormats: [eu-debit-credit]
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '413':
          $ref: '#/components/responses/FileTooLarge'

  /api/v1/import-profiles:
    get:
      tags: [Imports]
      operationId: listImportProfiles
      summary: List saved column mappings
      responses:
        '200':
          description: Saved mappings of the user.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ImportProfile'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [Imports]
      operationId: createImportProfile
      summary: Save a column mapping
      description: Map the columns of a bank without a built-in format once; use the returned `id` as `profileId` for 
        every import. Map either `amountColumn` or both `debitColumn` and `creditColumn`, and either `currencyColumn` or
        `defaultCurrency`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ImportProfileRequest'
            example:
              name: Local bank
              delimiter: ';'
              dateColumn: Data
              dateFormat: yyyy-MM-dd
              descriptionColumn: Paskirtis
              amountColumn: Suma
              defaultCurrency: EUR
              decimalSeparator: ','
      responses:
        '201':
          description: Mapping saved.
          headers:
            Location:
              description: URL of the new mapping.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportProfile'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/v1/import-profiles/{id}:
    delete:
      tags: [Imports]
      operationId: deleteImportProfile
      summary: Delete a saved column mapping
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '204':
          description: Mapping deleted.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/transactions:
    get:
      tags: [Transactions]
      operationId: listTransactions
      summary: List transactions
      description: Paginated, filtered and sorted list of the user's transactions. All filters are optional and combined
        with AND.
      parameters:
        - name: from
          in: query
          description: First booking date (inclusive).
          schema:
            type: string
            format: date
            example: '2026-11-01'
        - name: to
          in: query
          description: Last booking date (inclusive).
          schema:
            type: string
            format: date
            example: '2026-11-30'
        - name: categoryId
          in: query
          schema:
            type: string
            format: uuid
        - name: uncategorized
          in: query
          description: '`true` = only transactions without a category.'
          schema:
            type: boolean
        - name: needsReview
          in: query
          description: '`true` = only transactions the user should check.'
          schema:
            type: boolean
        - name: q
          in: query
          description: Text search in description and merchant (case-insensitive).
          schema:
            type: string
            maxLength: 100
            example: lidl
        - name: currency
          in: query
          schema:
            type: string
            pattern: '^[A-Za-z]{3}$'
            example: EUR
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - name: sort
          in: query
          description: Sort key and direction.
          schema:
            type: string
            enum: ['date,desc', 'date,asc', 'amount,asc', 'amount,desc', 'merchant,asc', 'merchant,desc']
            default: 'date,desc'
      responses:
        '200':
          description: One page of transactions.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionPage'
              example:
                items:
                  - id: 9f8e7d6c-5b4a-4398-8172-6f5e4d3c2b1a
                    date: '2026-11-02'
                    amount: -17.90
                    currency: EUR
                    description: LIDL 1234 VILNIUS
                    merchant: LIDL VILNIUS
                    category:
                      id: 00000000-0000-4000-8000-000000000001
                      name: Groceries
                      color: '#4CAF50'
                    categorizationSource: RULE
                    confidence: 1.00
                    needsReview: false
                page: 0
                size: 20
                totalItems: 1
                totalPages: 1
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/transactions/{id}:
    get:
      tags: [Transactions]
      operationId: getTransaction
      summary: Get a transaction
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: The transaction.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Transaction'
              example:
                id: 9f8e7d6c-5b4a-4398-8172-6f5e4d3c2b1a
                date: '2026-11-02'
                amount: -17.90
                currency: EUR
                description: LIDL 1234 VILNIUS
                merchant: LIDL VILNIUS
                category:
                  id: 00000000-0000-4000-8000-000000000001
                  name: Groceries
                  color: '#4CAF50'
                categorizationSource: RULE
                confidence: 1.00
                needsReview: false
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Transactions]
      operationId: updateTransactionCategory
      summary: Correct the category
      description: |
        Sets the category chosen by the user (source `MANUAL`). With `applyToMerchant: true` ("Always use this
        category") a rule *merchant → category* is created and all transactions of the same merchant that were not
        corrected manually are re-categorised. Future imports of this merchant use the rule without AI (US-2.3).
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTransactionRequest'
            example:
              categoryId: 00000000-0000-4000-8000-000000000002
              applyToMerchant: true
      responses:
        '200':
          description: Category updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateTransactionResponse'
              example:
                transaction:
                  id: 9f8e7d6c-5b4a-4398-8172-6f5e4d3c2b1a
                  date: '2026-11-02'
                  amount: -17.90
                  currency: EUR
                  description: LIDL 1234 VILNIUS
                  merchant: LIDL VILNIUS
                  category:
                    id: 00000000-0000-4000-8000-000000000001
                    name: Groceries
                    color: '#4CAF50'
                  categorizationSource: RULE
                  confidence: 1.00
                  needsReview: false
                ruleCreated: true
                recategorizedCount: 5
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/categories:
    get:
      tags: [Categories]
      operationId: listCategories
      summary: List categories
      description: Default categories plus the user's own categories, sorted by name.
      responses:
        '200':
          description: Categories visible to the user.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Category'
              example:
                - id: 00000000-0000-4000-8000-000000000001
                  name: Groceries
                  color: '#4CAF50'
                  kind: EXPENSE
                  isDefault: true
                  systemKey: groceries
                - id: 8c1b2a3d-4e5f-4a6b-9c7d-8e9f0a1b2c3d
                  name: Pets
                  color: '#8D6E63'
                  kind: EXPENSE
                  isDefault: false
                  systemKey:
        '401':
