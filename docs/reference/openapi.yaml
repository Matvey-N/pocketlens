                    income: 2500.00
                    net: 1215.65
                    byCategory:
                      - categoryId: 00000000-0000-4000-8000-000000000004
                        name: Housing
                        color: '#795548'
                        amount: 650.00
                        count: 1
                      - categoryId: 00000000-0000-4000-8000-000000000001
                        name: Groceries
                        color: '#4CAF50'
                        amount: 284.10
                        count: 17
                    trend:
                      - month: 2026-10
                        expenses: 1402.80
                        income: 2500.00
                      - month: 2026-11
                        expenses: 1284.35
                        income: 2500.00
                budgets:
                  - budgetId: 2c3d4e5f-6a7b-4c8d-9e0f-1a2b3c4d5e6f
                    categoryId: 00000000-0000-4000-8000-000000000001
                    categoryName: Groceries
                    categoryColor: '#4CAF50'
                    currency: EUR
                    limit: 300.00
                    spent: 284.10
                    remaining: 15.90
                    projectedSpending: 387.41
                    percentUsed: 95
