  /api/v1/conversations/{id}/messages:
    post:
      tags: [Assistant]
      operationId: askAssistant
      summary: Ask the assistant
      description: |
        Stores the question and answers it with **tool calling**: the language model only interprets the question
        and chooses backend tools (spending total, spending by category, largest/latest transactions, monthly
        totals, budget status, subscriptions); every figure is computed by a user-scoped database query. The answer
        contains the `interpretation` of the question (US-4.2) and `sourceTransactionCount`; the transactions are
        available from the "Show list" endpoint (US-4.3).

        Limits: 1 000 characters per question, 20 questions per minute per user (`429` with `Retry-After`).
        Typical latency 2–10 s. If the AI provider is unavailable the question is kept in the conversation and
        `503 AI_UNAVAILABLE` is returned — retry later. The request is **not idempotent**: retrying stores the
        question again.
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AskRequest'
            example:
              content: How much did I spend on groceries last month?
      responses:
        '201':
          description: Question and answer stored.
          headers:
            Location:
              description: URL of the answer message.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Exchange'
              example:
                question:
                  id: 0c1d2e3f-4a5b-4c6d-8e7f-9a0b1c2d3e4f
                  role: USER
                  content: How much did I spend on groceries last month?
                  interpretation: []
                  toolCalls: []
                  sourceTransactionCount: 0
                  createdAt: '2026-11-22T09:31:02Z'
                answer:
                  id: 1d2e3f4a-5b6c-4d7e-8f9a-0b1c2d3e4f5a
                  role: ASSISTANT
                  content: In October you spent 284.10 EUR on groceries in 17 purchases.
                  interpretation:
                    - 'Spending 2026-10-01 – 2026-10-31, category: Groceries'
                  toolCalls:
                    - tool: get_spending_total
                      arguments:
                        from: '2026-10-01'
                        to: '2026-10-31'
                        category: Groceries
                      interpretation: 'Spending 2026-10-01 – 2026-10-31, category: Groceries'
                      failed: false
                  sourceTransactionCount: 17
                  createdAt: '2026-11-22T09:31:06Z'

        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          description: The question was rejected by the prompt-injection filter (`PROMPT_REJECTED`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                type: https://pocketlens.app/problems/prompt-rejected
                title: The question cannot be processed
                status: 422
                detail: This question cannot be processed. Ask about your own spending, budgets or subscriptions.
                code: PROMPT_REJECTED
                correlationId: 4c5d6e7f-8091-4a2b-b3c4-d5e6f7a8b9c0
                timestamp: '2026-11-22T09:31:02Z'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/AiUnavailable'

  /api/v1/conversations/{id}/messages/{messageId}/transactions:
    get:
      tags: [Assistant]
      operationId: getAnswerSources
      summary: Show the transactions behind an answer
      description: Returns exactly the transactions an answer is based on and their sums per currency; the sum equals 
        the figure in the answer (US-4.3).
      parameters:
        - $ref: '#/components/parameters/Id'
        - name: messageId
          in: path
          required: true
          description: Id of the assistant message.
          schema:
            type: string
            format: uuid
      responses:
