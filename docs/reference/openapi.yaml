          description: Source transactions.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnswerSources'
              example:
                transactions:
                  - id: 9f8e7d6c-5b4a-4398-8172-6f5e4d3c2b1a
                    date: '2026-11-02'
                    amount: -17.90
                    currency: EUR
                    description: LIDL 1234 VILNIUS
                    merchant: LIDL VILNIUS
                    category:
                      id: 00000000-0000-4000-8000-000000000001
                      name: Groceries
                      color: '#4CAF50'
                    categorizationSource: RULE
                    confidence: 1.00
                    needsReview: false
                totals:
                  - currency: EUR
                    amount: 284.10
                    count: 17
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

